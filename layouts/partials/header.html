<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="Home">
      <span class="brand-mark" aria-hidden="true">TK</span>
      <span class="brand-name">{{ site.Params.short_name }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {{- range site.Menus.main }}
        <li{{ with .Params.compact }} class="nav-optional"{{ end }}><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
