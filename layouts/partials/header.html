<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="Home">
      <span class="brand-mark" aria-hidden="true">TK</span>
      <span class="brand-name">{{ site.Params.short_name }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {{- range $item := site.Menus.main }}
        <li{{ with .Params.compact }} class="nav-optional"{{ end }}><a href="{{ .URL | relURL }}">{{ $item.Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch between dark and light theme">
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M1.5 12h3M19.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
    </button>
  </div>
</header>
